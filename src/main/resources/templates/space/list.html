<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!-- 页面头部：复用公共布局的 <head>，标题为"车位管理 - 停车场管理系统" -->
<head th:replace="common/layout :: head('车位管理 - 停车场管理系统')"></head>
<body>
<!-- 顶部导航栏：复用公共布局 -->
<nav th:replace="common/layout :: topbar"></nav>
<div class="d-flex">
    <!-- 左侧菜单栏：高亮"车位管理"菜单项（sidebar('space') 中的 space 为菜单标识） -->
    <aside th:replace="common/layout :: sidebar('space')"></aside>
    <main class="flex-grow-1 content-area">
        <!-- 页面标题行：左侧标题，右侧"新增车位"按钮（点击弹出新增模态框） -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="page-title mb-0"><i class="bi bi-grid-3x3-gap me-2"></i>车位管理</h4>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSpaceModal">
                <i class="bi bi-plus-lg me-1"></i>新增车位
            </button>
        </div>

        <!-- 车位概览统计卡片：展示空闲/占用/故障/总车位数，数据来自 SpaceController.list() 放入 Model 的四个统计值 -->
        <div class="row g-3 mb-4">
            <!-- 空闲车位卡片（绿色边框/文字），th:text 绑定 freeCount -->
            <div class="col-md-3">
                <div class="card text-center border-start border-4 border-success">
                    <div class="card-body py-3">
                        <div class="text-muted" style="font-size:13px;"><i class="bi bi-circle-fill me-1" style="color:#198754;"></i>空闲车位</div>
                        <div class="fs-4 fw-bold text-success" th:text="${freeCount}">0</div>
                    </div>
                </div>
            </div>
            <!-- 占用车位卡片（黄色边框/文字），th:text 绑定 occupiedCount -->
            <div class="col-md-3">
                <div class="card text-center border-start border-4 border-warning">
                    <div class="card-body py-3">
                        <div class="text-muted" style="font-size:13px;"><i class="bi bi-circle-fill me-1" style="color:#ffc107;"></i>占用车位</div>
                        <div class="fs-4 fw-bold text-warning" th:text="${occupiedCount}">0</div>
                    </div>
                </div>
            </div>
            <!-- 故障车位卡片（红色边框/文字），th:text 绑定 faultCount -->
            <div class="col-md-3">
                <div class="card text-center border-start border-4 border-danger">
                    <div class="card-body py-3">
                        <div class="text-muted" style="font-size:13px;"><i class="bi bi-circle-fill me-1" style="color:#dc3545;"></i>故障车位</div>
                        <div class="fs-4 fw-bold text-danger" th:text="${faultCount}">0</div>
                    </div>
                </div>
            </div>
            <!-- 总车位数卡片（蓝色边框），th:text 绑定 totalCount -->
            <div class="col-md-3">
                <div class="card text-center border-start border-4 border-primary">
                    <div class="card-body py-3">
                        <div class="text-muted" style="font-size:13px;"><i class="bi bi-collection me-1"></i>总车位数</div>
                        <div class="fs-4 fw-bold" style="color:#1e3a5f;" th:text="${totalCount}">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 车位列表卡片：表头右侧为筛选表单（GET 方式提交到 /space/list，与后端 list() 的 status/areaType 参数对应） -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-list-ul me-1"></i>车位列表</span>
                <form class="d-flex" th:action="@{/space/list}" method="get">
                    <!-- 状态筛选下拉框：值 0 空闲 / 1 占用 / 2 故障，th:selected 根据当前请求参数回显选中项 -->
                    <select name="status" class="form-select form-select-sm me-2" style="width:130px;">
                        <option value="">全部状态</option>
                        <option value="0" th:selected="${param.status != null and param.status[0] == '0'}">空闲</option>
                        <option value="1" th:selected="${param.status != null and param.status[0] == '1'}">占用</option>
                        <option value="2" th:selected="${param.status != null and param.status[0] == '2'}">故障</option>
                    </select>
                    <!-- 区域类型筛选下拉框：临时区 / 月租区 -->
                    <select name="areaType" class="form-select form-select-sm me-2" style="width:120px;">
                        <option value="">全部区域</option>
                        <option value="临时区" th:selected="${param.areaType != null and param.areaType[0] == '临时区'}">临时区</option>
                        <option value="月租区" th:selected="${param.areaType != null and param.areaType[0] == '月租区'}">月租区</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-outline-primary">查询</button>
                </form>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <!-- 车位信息表格：列依次为 车位ID / 车位编号 / 所属区域 / 状态 / 绑定车辆 / 操作 -->
                    <table class="table table-hover table-striped mb-0">
                        <colgroup>
                            <col style="width:12%">
                            <col style="width:20%">
                            <col style="width:16%">
                            <col style="width:18%">
                            <col style="width:18%">
                            <col style="width:16%">
                        </colgroup>
                        <thead>
                        <tr>
                            <th>车位ID</th>
                            <th>车位编号</th>
                            <th>所属区域</th>
                            <th>状态</th>
                            <th>绑定车辆</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- th:each 遍历后端传入的 list（ParkingSpace 集合），每行渲染一个车位 -->
                        <tr th:each="s : ${list}">
                            <td th:text="${s.spaceId}">1</td>
                            <td><strong th:text="${s.spaceCode}">A001</strong></td>
                            <!-- 所属区域：临时区显示蓝色徽章，月租区显示青色徽章，其它区域原样显示 -->
                            <td>
                                <span th:if="${s.areaType == '临时区'}" class="badge text-bg-primary">临时区</span>
                                <span th:if="${s.areaType == '月租区'}" class="badge text-bg-info">月租区</span>
                                <span th:if="${s.areaType != '临时区' and s.areaType != '月租区'}" th:text="${s.areaType}">其他</span>
                            </td>
                            <!-- 车位状态徽章：0 空闲(绿) / 1 占用(黄) / 2 故障(红)，与后端 status 定义一致 -->
                            <td>
                                <span th:if="${s.status == 0}" class="badge text-bg-success">空闲</span>
                                <span th:if="${s.status == 1}" class="badge text-bg-warning">占用</span>
                                <span th:if="${s.status == 2}" class="badge text-bg-danger">故障</span>
                            </td>
                            <!-- 绑定车辆：有车牌显示车牌号，无车牌显示"—" -->
                            <td>
                                <span th:if="${s.carNum != null}" th:text="${s.carNum}">蒙A12345</span>
                                <span th:if="${s.carNum == null}" class="text-muted">—</span>
                            </td>
                            <!-- 操作按钮：
                                 故障车位 → 显示"恢复空闲"按钮（updateStatus status=0）
                                 正常车位 → 显示"标记故障"按钮（updateStatus status=2）
                                 所有车位 → 显示"删除"按钮（delete，点击前 confirm 二次确认） -->
                            <td>
                                <a th:if="${s.status == 2}"
                                   th:href="@{/space/updateStatus/{id}/{status}(id=${s.spaceId}, status=0)}"
                                   class="btn btn-sm btn-outline-success" th:title="恢复空闲">
                                    <i class="bi bi-arrow-counterclockwise"></i>
                                </a>
                                <a th:if="${s.status != 2}"
                                   th:href="@{/space/updateStatus/{id}/{status}(id=${s.spaceId}, status=2)}"
                                   class="btn btn-sm btn-outline-danger" th:title="标记故障">
                                    <i class="bi bi-tools"></i>
                                </a>
                                <a th:href="@{/space/delete/{id}(id=${s.spaceId})}"
                                   class="btn btn-sm btn-outline-secondary"
                                   onclick="return confirm('确定删除车位 ' + $(this).closest('tr').find('td:nth-child(2)').text() + ' 吗？');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <!-- 空数据提示：列表为空时显示"暂无车位数据" -->
                        <tr th:if="${#lists.isEmpty(list)}">
                            <td colspan="6" class="text-center text-muted py-4">暂无车位数据</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 新增车位模态框：表单 POST 提交到 /space/add（对应 SpaceController.add()），
     字段为 spaceCode(车位编号) 与 areaType(区域类型)，状态由后端默认置为空闲 -->
<div class="modal fade" id="addSpaceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/space/add}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus-square me-1"></i>新增车位</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- 车位编号输入框：必填，占位示例 A006 -->
                    <div class="mb-3">
                        <label class="form-label">车位编号</label>
                        <input type="text" name="spaceCode" class="form-control" placeholder="如 A006" required>
                    </div>
                    <!-- 所属区域下拉框：临时区 / 月租区 -->
                    <div class="mb-0">
                        <label class="form-label">所属区域</label>
                        <select name="areaType" class="form-select">
                            <option value="临时区">临时区</option>
                            <option value="月租区">月租区</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 引入 Bootstrap 组件脚本（模态框、提示等交互依赖） -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
