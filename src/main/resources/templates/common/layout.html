<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">停车场管理系统</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --parking-primary: #1e3a5f;
            --parking-accent: #0d6efd;
        }
        body { background-color: #f4f6f9; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        .navbar-parking { background: var(--parking-primary); }
        .navbar-parking .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .sidebar {
            width: 220px;
            min-height: calc(100vh - 56px);
            background: #fff;
            border-right: 1px solid #e3e6ea;
            padding: 0;
        }
        .sidebar .nav-link {
            color: #4a5568;
            padding: 12px 20px;
            border-left: 3px solid transparent;
            font-size: 14px;
        }
        .sidebar .nav-link:hover { background: #f0f4ff; color: var(--parking-primary); }
        .sidebar .nav-link.active {
            background: #eef3ff;
            color: var(--parking-primary);
            border-left-color: var(--parking-accent);
            font-weight: 600;
        }
        .sidebar .nav-link i { margin-right: 8px; width: 18px; text-align: center; }
        .sidebar .menu-title {
            font-size: 12px;
            color: #9aa5b1;
            padding: 14px 20px 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .content-area { padding: 24px; }
        .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-radius: 8px; }
        .card-header { background: #fff; border-bottom: 1px solid #eef0f3; font-weight: 600; }
        .page-title { font-size: 20px; font-weight: 700; color: var(--parking-primary); }
        .badge-status { font-size: 12px; padding: 4px 10px; }
        table.table th { background: #f8f9fb; color: #4a5568; font-size: 13px; white-space: nowrap; }
        table.table td { font-size: 14px; vertical-align: middle; }
        .form-label { font-size: 13px; font-weight: 600; color: #4a5568; }
    </style>
</head>

<!-- ===== fragment：顶部导航栏 ===== -->
<nav th:fragment="topbar" class="navbar navbar-expand-lg navbar-dark navbar-parking sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/index}">
            <i class="bi bi-p-square-fill me-2"></i>停车场管理系统
        </a>
        <div class="d-flex align-items-center text-white-50" style="font-size:14px;">
            <span class="me-3"><i class="bi bi-person-circle me-1"></i>
                欢迎，<span th:text="${session.loginUser != null ? session.loginUser.realName : '未登录'}">管理员</span>
            </span>
            <span th:if="${session.loginUser != null and session.loginUser.roleId == 1}" class="badge bg-info me-3">超级管理员</span>
            <span th:if="${session.loginUser != null and session.loginUser.roleId == 2}" class="badge bg-secondary me-3">收费员</span>
            <a th:href="@{/auth/logout}" class="btn btn-sm btn-outline-light">
                <i class="bi bi-box-arrow-right me-1"></i>退出登录
            </a>
        </div>
    </div>
</nav>

<!-- ===== fragment：侧边栏（active 传入当前菜单标识） ===== -->
<aside th:fragment="sidebar(active)" class="sidebar d-none d-md-block">
    <div class="menu-title">系统功能</div>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active=='home'}?'active':''" th:href="@{/index}">
                <i class="bi bi-speedometer2"></i>系统首页
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active=='car'}?'active':''" th:href="@{/car/record}">
                <i class="bi bi-car-front"></i>车辆进出管理
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active=='space'}?'active':''" th:href="@{/space/list}">
                <i class="bi bi-grid-3x3-gap"></i>车位管理
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active=='order'}?'active':''" th:href="@{/order/list}">
                <i class="bi bi-receipt"></i>订单计费管理
            </a>
        </li>
        <li class="nav-item" th:if="${session.loginUser != null and session.loginUser.roleId == 1}">
            <a class="nav-link" th:classappend="${active=='rule'}?'active':''" th:href="@{/order/rule}">
                <i class="bi bi-cash-coin"></i>收费规则配置
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active=='stat'}?'active':''" th:href="@{/stat/index}">
                <i class="bi bi-bar-chart-line"></i>数据统计
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active=='black'}?'active':''" th:href="@{/stat/blacklist}">
                <i class="bi bi-person-x"></i>黑名单管理
            </a>
        </li>
        <li class="nav-item" th:if="${session.loginUser != null and session.loginUser.roleId == 1}">
            <a class="nav-link" th:classappend="${active=='user'}?'active':''" th:href="@{/auth/userList}">
                <i class="bi bi-people"></i>用户管理
            </a>
        </li>
    </ul>
</aside>
</html>
