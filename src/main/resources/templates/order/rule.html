<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/layout :: head('收费规则配置 - 停车场管理系统')"></head>
<body>
<nav th:replace="common/layout :: topbar"></nav>
<div class="d-flex">
    <aside th:replace="common/layout :: sidebar('rule')"></aside>
    <main class="flex-grow-1 content-area">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="page-title mb-0"><i class="bi bi-cash-coin me-2"></i>收费规则配置</h4>
        </div>

        <!-- 当前规则概览 -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body py-3">
                        <div class="text-muted" style="font-size:13px;">首小时费用</div>
                        <div class="fs-4 fw-bold" style="color:#1e3a5f;" th:text="'¥' + ${rule.firstHourPrice}">¥5.00</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body py-3">
                        <div class="text-muted" style="font-size:13px;">续时单价（每小时）</div>
                        <div class="fs-4 fw-bold" style="color:#1e3a5f;" th:text="'¥' + ${rule.perHourPrice}">¥2.00</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body py-3">
                        <div class="text-muted" style="font-size:13px;">单日封顶</div>
                        <div class="fs-4 fw-bold" style="color:#1e3a5f;" th:text="'¥' + ${rule.dayMaxPrice}">¥20.00</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body py-3">
                        <div class="text-muted" style="font-size:13px;">月租价格</div>
                        <div class="fs-4 fw-bold" style="color:#1e3a5f;" th:text="'¥' + ${rule.monthPrice}">¥300.00</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 规则编辑表单 -->
        <div class="card">
            <div class="card-header"><i class="bi bi-sliders me-1"></i>修改收费标准（仅超级管理员可操作）</div>
            <div class="card-body">
                <form th:action="@{/order/rule/update}" method="post" class="row g-3">
                    <input type="hidden" name="ruleId" th:value="${rule.ruleId}">
                    <div class="col-md-3">
                        <label class="form-label">首小时费用（元）</label>
                        <input type="number" name="firstHourPrice" class="form-control" step="0.01" min="0"
                               th:value="${rule.firstHourPrice}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">续时单价（元/小时）</label>
                        <input type="number" name="perHourPrice" class="form-control" step="0.01" min="0"
                               th:value="${rule.perHourPrice}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">单日封顶（元）</label>
                        <input type="number" name="dayMaxPrice" class="form-control" step="0.01" min="0"
                               th:value="${rule.dayMaxPrice}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">月租价格（元/月）</label>
                        <input type="number" name="monthPrice" class="form-control" step="0.01" min="0"
                               th:value="${rule.monthPrice}" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>保存规则
                        </button>
                        <span class="text-muted ms-3" style="font-size:13px;">
                            计费规则：首小时按首小时费用计费，超过部分按续时单价累加，单日最高不超过封顶金额。
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
