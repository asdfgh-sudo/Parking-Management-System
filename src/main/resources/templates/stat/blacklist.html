<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/layout :: head('黑名单管理 - 停车场管理系统')"></head>
<body>
<nav th:replace="common/layout :: topbar"></nav>
<div class="d-flex">
    <aside th:replace="common/layout :: sidebar('black')"></aside>
    <main class="flex-grow-1 content-area">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="page-title mb-0"><i class="bi bi-person-x me-2"></i>黑名单管理</h4>
        </div>

        <div class="row g-4">
            <!-- 添加黑名单 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header"><i class="bi bi-person-plus-slash me-1"></i>添加黑名单车辆</div>
                    <div class="card-body">
                        <form th:action="@{/stat/blacklist/add}" method="post">
                            <div class="mb-3">
                                <label class="form-label">车牌号</label>
                                <input type="text" name="carNum" class="form-control" placeholder="如 蒙A66666" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">拉黑原因</label>
                                <textarea name="reason" class="form-control" rows="3"
                                          placeholder="如：长期欠费未缴 / 违规停车" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-danger w-100">
                                <i class="bi bi-person-x me-1"></i>加入黑名单
                            </button>
                            <div class="form-text mt-2">
                                黑名单车辆入场登记时将自动被拦截，禁止入场。
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 黑名单列表 -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-list-ul me-1"></i>黑名单列表
                        <span class="badge bg-danger ms-2" th:text="'共 ' + ${#lists.size(list)} + ' 辆'">共 0 辆</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-striped mb-0">
                                <colgroup>
                                    <col style="width:12%">
                                    <col style="width:20%">
                                    <col style="width:38%">
                                    <col style="width:20%">
                                    <col style="width:10%">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>车牌号</th>
                                    <th>拉黑原因</th>
                                    <th>拉黑时间</th>
                                    <th>操作</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="b : ${list}">
                                    <td th:text="${b.blackId}">1</td>
                                    <td><span class="badge text-bg-danger" th:text="${b.carNum}">蒙A66666</span></td>
                                    <td th:text="${b.reason}">长期欠费未缴</td>
                                    <td th:text="${#temporals.format(b.createTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 10:00</td>
                                    <td>
                                        <a th:href="@{/stat/blacklist/remove/{id}(id=${b.blackId})}"
                                           class="btn btn-sm btn-outline-success"
                                           onclick="return confirm('确定将该车辆移出黑名单？');">
                                            <i class="bi bi-check2-circle me-1"></i>解禁
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(list)}">
                                    <td colspan="5" class="text-center text-muted py-4">暂无黑名单车辆</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
