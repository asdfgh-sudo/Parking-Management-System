<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 停车场管理系统</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 55%, #3a7bd5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .login-card {
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
        }
        .login-logo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #1e3a5f;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px;
        }
        .login-title { font-size: 22px; font-weight: 700; color: #1e3a5f; }
        .login-sub { font-size: 13px; color: #8a94a6; }
        .form-control:focus { box-shadow: 0 0 0 .2rem rgba(30,58,95,.15); border-color: #1e3a5f; }
    </style>
</head>
<body>
<div class="container">
    <div class="card login-card mx-auto">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="login-logo"><i class="bi bi-p-square-fill"></i></div>
                <div class="login-title">停车场管理系统</div>
                <div class="login-sub mt-1">Parking Management System</div>
            </div>

            <div th:if="${msg != null}" class="alert alert-danger py-2" role="alert">
                <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${msg}">登录失败</span>
            </div>

            <form th:action="@{/auth/doLogin}" method="post">
                <div class="mb-3">
                    <label class="form-label">登录账号</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="请输入账号" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">登录密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                    </div>
                </div>
                <button type="submit" class="btn w-100 text-white py-2" style="background:#1e3a5f;">
                    <i class="bi bi-box-arrow-in-right me-1"></i>登 录
                </button>
            </form>

            <div class="text-center mt-4 text-muted" style="font-size:12px;">
                测试账号：admin / 123456（管理员）&nbsp;&nbsp;|&nbsp;&nbsp;op01 / 123456（收费员）
            </div>
        </div>
    </div>
</div>
</body>
</html>
